apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: cicd-argocd
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Pedro561506/cicd-argocd.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true