apiVersion: apps/v1
kind: Deployment

metadata:
  name: cicd-argocd

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cicd-argocd

  template:
    metadata:
      labels:
        app: cicd-argocd

    spec:
      containers:
        - name: cicd-argocd
          image: pedropedrada/cicd-argocd:initial
          imagePullPolicy: Always

          ports:
            - containerPort: 80