apiVersion: apps/v1
kind: Deployment

metadata:
  name: cicd-argocd

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cicd-argocd

  template:
    metadata:
      labels:
        app: cicd-argocd

    spec:
      containers:
        - name: cicd-argocd
          image: pedropedrada/cicd-argocd:29ca74b448a22aeeb13921cba49a49ff80d2d1cf
          imagePullPolicy: Always

          ports:
            - containerPort: 80