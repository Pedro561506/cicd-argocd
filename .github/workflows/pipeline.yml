name: CI - Build e Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'k8s/**'
      - 'argocd/**'

  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE_NAME: pedropedrada/cicd-argocd

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_PEDROPEDRADA }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e publicação da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Atualizar imagem no manifesto Kubernetes
        run: |
          sed -i "s|image: .*|image: $IMAGE_NAME:${GITHUB_SHA}|g" k8s/deployment.yaml

      - name: Commit da nova versão do manifesto
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add k8s/deployment.yaml
          git diff --cached --quiet || git commit -m "Atualiza imagem para ${GITHUB_SHA} [skip ci]"
          git push